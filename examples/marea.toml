# Example project file. The folder of this file is the project root, so every namespace
# is the path of a file relative to this folder.

[project]
name = "examples"

# Global defaults. A file attribute or a symbol attribute overrides each of them.
[defaults]
simd = true
inline = "auto"

# Build mode of the whole project. #[build = ...] on a symbol overrides it.
[profile.debug]
build = "debug"

[profile.release]
build = "release"
strip = true
